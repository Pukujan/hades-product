[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hades-product"
version = "0.1.0"
description = "Host-independent Hades — gold, tools, tests. No mouth LLM in this package."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["tools*", "hades_runtime*"]
